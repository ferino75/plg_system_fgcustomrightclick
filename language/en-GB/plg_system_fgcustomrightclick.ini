PLG_SYSTEM_FGCUSTOMRIGHTCLICK="FG - Custom Right Click"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_XML_DESCRIPTION="Disable printing, text selection/copy, image dragging, developer-tools keyboard shortcuts and the browser right-click menu on the frontend. Optionally show a popup message or a fully custom, ARIA-accessible context menu. Rules apply only to selected user groups."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_BASIC="Protection"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_EXCLUSIONS="Exclusions"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_SHORTCUTS="Custom Shortcuts"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_ACCESSIBILITY="Accessibility"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_POPUP="Popup"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_MENU="Custom menu"

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_USERGROUPS_LABEL="Apply to user groups"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_USERGROUPS_DESC="Rules will only be applied to visitors belonging to the selected groups. Leave empty to apply to everyone. Example: select only 'Public' to restrict guests while registered users keep the normal browser behaviour."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_COMPONENTS_LABEL="Exclude components"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_COMPONENTS_DESC="One component name per line (e.g. com_contact). The plugin does nothing at all on pages rendered by a listed component - not even print/devtools blocking. Leave empty to apply everywhere."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_URLS_LABEL="Exclude URL paths"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_URLS_DESC="One pattern per line, matched as a case-insensitive substring against the current page's full URL (e.g. /contact-us or ?view=form). The plugin does nothing at all when any pattern matches. Leave empty to apply everywhere."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_CUSTOM_SHORTCUTS_LABEL="Custom keyboard shortcuts"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_CUSTOM_SHORTCUTS_DESC="Block additional keyboard combinations beyond the built-in ones above (e.g. Ctrl+Shift+S to block a browser's own screenshot-annotation shortcut). Modifier matching is exact - a shortcut configured as plain Ctrl+K does not also match Ctrl+Shift+K. Cmd and Ctrl are treated as the same modifier for cross-platform Mac/Windows support. Like the other keyboard options, these only block the shortcut - not a security measure."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIERS_LABEL="Modifiers"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIER_CTRL="Ctrl / Cmd"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIER_SHIFT="Shift"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIER_ALT="Alt / Option"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_KEY_LABEL="Key"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_KEY_DESC="A single character (e.g. k) or a named key (e.g. Escape, F1, ArrowLeft) - whatever the browser reports for that key press."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_WARNING_LABEL="Show warning when JavaScript is disabled"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_WARNING_DESC="Shows a small banner via HTML's native 'noscript' feature when a visitor has JavaScript turned off. This ONLY ever shows an informational message - it never hides page content or blocks access, since none of this plugin's protections apply without JavaScript anyway (they are all JS-based) and hiding content from a legitimate visitor without JS would be worse than the problem this plugin solves."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_MESSAGE_LABEL="Warning message"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_MESSAGE_DESC="A limited, safe set of HTML tags is allowed (a, strong, em, b, i, br, p, span, ul, ol, li), same as the popup message. Leave empty to use the default message."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_PRINT_LABEL="Disable printing"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_PRINT_DESC="Blocks Ctrl/Cmd+P and hides the page content in print output."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SELECT_LABEL="Disable text selection & copy"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SELECT_DESC="Prevents highlighting text and copying it (mouse and Ctrl+C/X/A). Form fields remain usable."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_IMAGEDRAG_LABEL="Disable image dragging"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_IMAGEDRAG_DESC="Prevents dragging images out of the page (drag & drop saving)."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SAVE_LABEL="Discourage saving the page"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SAVE_DESC="Blocks the Ctrl/Cmd+S keyboard shortcut only. Same limitation as the devtools option above: the browser's own menu (e.g. ⋮ → 'Save page as...') still offers the exact same action, and there is no way to block that from a web page - clicking a browser's own menu never fires any event a page can intercept."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_BLOCK_DEVTOOLS_LABEL="Discourage developer-tools shortcuts"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_BLOCK_DEVTOOLS_DESC="Not a security measure - it does not protect your source code or content. It only removes the F12, Ctrl+Shift+I/J/C/K, Cmd+Opt+I/J/C/K (macOS), Ctrl+U and Cmd+Opt+U (Safari) keyboard shortcuts; DevTools remain reachable via the browser's own menu, and this does nothing against browser extensions, external tools, disabling JavaScript, cached copies, a plain HTTP client, or a screenshot/OCR. Enable only if a small deterrent against casual right-click-avoidant users is what you want."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_INTERACTIVE_LABEL="Skip on interactive elements"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_INTERACTIVE_DESC="When enabled (recommended), links, form fields, buttons, embedded content (iframes, canvas-based maps, audio/video players), and other interactive elements (summary/details, labels, ARIA role='button') keep their normal browser right-click menu and text selection/copy behaviour, even when the protections above are active. Video is exempt only while 'Also protect video' is off. Turn this off only if you deliberately want to block right-click and copying everywhere - this also breaks the normal 'right-click a link to open it in a new tab' gesture and can interfere with pasting into fields. Note: this cannot see inside a web component's Shadow DOM, so a custom element is only exempt if it exposes one of the above (e.g. role='button') on itself."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXTRA_EXEMPT_SELECTORS_LABEL="Additional exception selectors"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXTRA_EXEMPT_SELECTORS_DESC="One CSS selector per line, added to the list above - use this for a custom widget, web component, or third-party element this plugin doesn't recognise by default (e.g. my-map-widget or .chart-tooltip). Invalid selectors are safely ignored (check the browser console for a warning naming which one). Custom elements can only be matched by a selector on the element itself, not on anything inside its Shadow DOM."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_LABEL="Disable right click"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_DESC="'No' keeps the default browser menu. 'Yes' disables it (optionally showing the popup below). 'Only for images' disables it only over images. 'Custom menu' replaces the browser menu with your own menu defined in the 'Custom menu' tab - if that tab ends up with no usable items (none configured, or all rejected for using a disallowed URL scheme), visitors get the normal browser menu instead of no menu at all."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_NO="No (default browser menu)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_YES="Yes (optionally show popup)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_IMAGES="Yes, but only for images"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_MENU="Yes, and show custom menu"

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_VIDEO_LABEL="Also protect video"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_VIDEO_DESC="Used only when 'Disable right click' is set to 'Only for images'. Extends the protection (and, if enabled, drag prevention) to video elements as well. Off by default, since protecting video is a distinct concern from protecting still images."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_BG_LABEL="Also protect CSS background images"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_BG_DESC="Used only when 'Disable right click' is set to 'Only for images'. Extends the protection to elements whose own CSS background-image is set (e.g. a banner or card). Only the exact element right-clicked is checked, not its ancestors, so a button or link nested inside a background-image container is never affected. Off by default."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_ENABLED_LABEL="Show popup on right click"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_ENABLED_DESC="Used only when 'Disable right click' is set to 'Yes'."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_TITLE_LABEL="Popup title"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_MESSAGE_LABEL="Popup message"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_MESSAGE_DESC="A limited, safe set of HTML tags is allowed (a, strong, em, b, i, br, p, span, ul, ol, li). Scripts, iframes, event handlers and unsafe link schemes are always stripped."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_TIMEOUT_LABEL="Auto-close after (seconds)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_TIMEOUT_DESC="0 = the popup stays open until the visitor closes it."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MENUITEMS_LABEL="Menu items"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MENUITEMS_DESC="Used only when 'Disable right click' is set to 'Custom menu'. Each item is a link or one of a fixed set of built-in actions - there is no way to run custom JavaScript, so the menu cannot be used to inject code. The placeholder {url} in a link is replaced with the current page URL. Example link: https://twitter.com/intent/tweet?text={url}"

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_LABEL="Type"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_LINK="Link (URL)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_ACTION="Built-in action"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_SEPARATOR="Separator"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ICON_LABEL="Icon"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ICON_DESC="Emoji (e.g. 🔄) or an icon CSS class (fa-*, icon-*, bi-*)."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_LABEL_LABEL="Label"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_VALUE_LABEL="URL"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_VALUE_DESC="Used for 'Link' items only. Allowed: relative paths (/page), #anchors, ?query strings, https://, http://, mailto:, tel:. Any other scheme (javascript:, data:, vbscript:, ...) is rejected. {url} = current page URL: if the value is nothing but {url}, the raw URL is used (e.g. for a 'this page' link); embedded inside anything else (e.g. ?text={url}) it is automatically URL-encoded, as needed inside a query string."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_LABEL="Action"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_DESC="Used for 'Built-in action' items only. Pick one of the predefined, safe actions below - no custom code can be entered. Note on 'Print the page': if 'Disable printing' is also enabled above, this menu item will still open the browser's print dialog, but the printed page will just show the 'printing is disabled' message, since that protection applies no matter how printing was triggered - avoid combining the two if you want the button to actually print the page."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_RELOAD="Reload the page"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_COPY_URL="Copy page URL to clipboard"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_PRINT="Print the page"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_SCROLL_TOP="Scroll to top"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_SHARE="Share page (or copy URL as fallback)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_NEWTAB_LABEL="Open in new tab"

; Frontend runtime strings (not admin form fields) - used for ARIA labels
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_POPUP_CLOSE_LABEL="Close"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_MENU_ARIA_LABEL="Context menu"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_PRINT_DISABLED_MESSAGE="Printing is disabled on this website."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_COPIED_MESSAGE="Copied to clipboard"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_COPY_FAILED_MESSAGE="Could not copy to clipboard"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_MANUAL_COPY_MESSAGE="Could not copy automatically. Press Ctrl+C (or Cmd+C on Mac) to copy:"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_NOSCRIPT_DEFAULT_MESSAGE="Some content-protection features on this site require JavaScript to be enabled."
