PLG_SYSTEM_FGCUSTOMRIGHTCLICK="FG - Custom Right Click"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_XML_DESCRIPTION="Zakáže tlač, označovanie/kopírovanie textu, ťahanie obrázkov, klávesové skratky vývojárskych nástrojov a kontextové menu prehliadača na fronte webu. Voliteľne zobrazí vyskakovacie okno alebo vlastné, plne prístupné (ARIA) kontextové menu. Pravidlá sa aplikujú len na vybrané skupiny používateľov."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_BASIC="Ochrana"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_EXCLUSIONS="Vylúčenia"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_SHORTCUTS="Vlastné skratky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_ACCESSIBILITY="Prístupnosť"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_POPUP="Vyskakovacie okno"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELDSET_MENU="Vlastné menu"

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_USERGROUPS_LABEL="Aplikovať na skupiny používateľov"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_USERGROUPS_DESC="Pravidlá sa aplikujú len na návštevníkov z vybraných skupín. Ponechajte prázdne pre všetkých. Príklad: vyberte len 'Public' — obmedzenia budú platiť pre hostí, prihlásení používatelia budú mať normálne správanie prehliadača."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_COMPONENTS_LABEL="Vylúčiť komponenty"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_COMPONENTS_DESC="Jeden názov komponenty na riadok (napr. com_contact). Plugin na stránkach vykresľovaných uvedenou komponentou nerobí vôbec nič - ani blokovanie tlače/DevTools. Ponechajte prázdne pre aplikáciu všade."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_URLS_LABEL="Vylúčiť URL cesty"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXCLUDE_URLS_DESC="Jeden vzor na riadok, porovnáva sa ako podreťazec (bez rozlišovania veľkosti písmen) voči celej URL aktuálnej stránky (napr. /kontakt alebo ?view=form). Plugin nerobí vôbec nič, keď sa zhoduje ktorýkoľvek vzor. Ponechajte prázdne pre aplikáciu všade."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_CUSTOM_SHORTCUTS_LABEL="Vlastné klávesové skratky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_CUSTOM_SHORTCUTS_DESC="Zablokujte ďalšie klávesové kombinácie nad rámec tých vstavaných vyššie (napr. Ctrl+Shift+S pre zablokovanie vlastnej skratky prehliadača na anotáciu snímky obrazovky). Zhoda modifikátorov je presná - skratka nastavená ako obyčajné Ctrl+K sa nezhoduje aj s Ctrl+Shift+K. Cmd a Ctrl sa považujú za rovnaký modifikátor kvôli kompatibilite Mac/Windows. Rovnako ako ostatné klávesové voľby, aj toto len blokuje skratku - nejde o bezpečnostné opatrenie."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIERS_LABEL="Modifikátory"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIER_CTRL="Ctrl / Cmd"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIER_SHIFT="Shift"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_MODIFIER_ALT="Alt / Option"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_KEY_LABEL="Kláves"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_SHORTCUT_KEY_DESC="Jeden znak (napr. k) alebo pomenovaný kláves (napr. Escape, F1, ArrowLeft) - podľa toho, čo prehliadač nahlási pri stlačení daného klávesu."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_WARNING_LABEL="Zobraziť varovanie pri vypnutom JavaScripte"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_WARNING_DESC="Zobrazí malý banner cez natívnu 'noscript' funkciu HTML, keď má návštevník vypnutý JavaScript. Toto VŽDY zobrazí len informačnú správu - nikdy neskryje obsah stránky ani nezablokuje prístup, keďže žiadna z ochrán tohto pluginu bez JavaScriptu aj tak nefunguje (všetky sú založené na JS) a skrytie obsahu pred legitímnym návštevníkom bez JS by bolo horšie, než problém, ktorý tento plugin rieši."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_MESSAGE_LABEL="Text varovania"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_NOSCRIPT_MESSAGE_DESC="Je povolená obmedzená, bezpečná sada HTML tagov (a, strong, em, b, i, br, p, span, ul, ol, li), rovnako ako pri texte popupu. Ponechajte prázdne pre predvolenú správu."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_PRINT_LABEL="Zakázať tlač"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_PRINT_DESC="Zablokuje Ctrl/Cmd+P a skryje obsah stránky v tlačovom výstupe."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SELECT_LABEL="Zakázať označovanie a kopírovanie textu"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SELECT_DESC="Zabráni označovaniu textu a jeho kopírovaniu (myšou aj cez Ctrl+C/X/A). Formulárové polia zostanú funkčné."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_IMAGEDRAG_LABEL="Zakázať ťahanie obrázkov"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_IMAGEDRAG_DESC="Zabráni vyťahovaniu obrázkov zo stránky (uloženie cez drag & drop)."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SAVE_LABEL="Sťažiť uloženie stránky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_DISABLE_SAVE_DESC="Blokuje len klávesovú skratku Ctrl/Cmd+S. Rovnaké obmedzenie ako pri voľbe pre vývojárske nástroje vyššie: menu prehliadača (napr. ⋮ → 'Uložiť stránku ako...') ponúka tú istú akciu naďalej, a neexistuje spôsob, ako to zo stránky zablokovať - kliknutie na položku menu prehliadača nikdy nevyvolá žiadny event, ktorý by stránka mohla zachytiť."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_BLOCK_DEVTOOLS_LABEL="Sťažiť skratky pre vývojárske nástroje"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_BLOCK_DEVTOOLS_DESC="Nejde o bezpečnostné opatrenie - nechráni zdrojový kód ani obsah stránky. Odstráni len klávesové skratky F12, Ctrl+Shift+I/J/C/K, Cmd+Opt+I/J/C/K (macOS), Ctrl+U a Cmd+Opt+U (Safari); DevTools sa dajú stále otvoriť cez menu prehliadača a nič z toho nezastaví rozšírenia prehliadača, externé nástroje, vypnutý JavaScript, kešované kópie stránky, obyčajný HTTP klient ani snímku obrazovky/OCR. Zapnite len ak vám stačí drobné odrádzanie bežných používateľov."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_INTERACTIVE_LABEL="Vynechať pri interaktívnych prvkoch"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_INTERACTIVE_DESC="Keď je zapnuté (odporúčané), odkazy, formulárové polia, tlačidlá, vložený obsah (iframe, mapy na canvase, audio/video prehrávače) a ďalšie interaktívne prvky (summary/details, labely, ARIA role='button') si zachovajú normálne správanie pravého kliku (menu prehliadača) aj výberu/kopírovania textu, aj keď sú vyššie uvedené ochrany aktívne. Video je vynechané len pokým je vypnuté 'Chrániť aj video'. Vypnite len vtedy, ak naozaj chcete blokovať pravý klik a kopírovanie úplne všade - tým sa zároveň rozbije bežné gesto 'pravý klik na odkaz → otvoriť na novej karte' a môže to prekážať pri vkladaní textu do polí. Pozor: toto nevidí dovnútra Shadow DOM webových komponentov, takže vlastný element je vynechaný len ak sám na sebe má niektorý z vyššie uvedených atribútov (napr. role='button')."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXTRA_EXEMPT_SELECTORS_LABEL="Ďalšie výnimkové selektory"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_EXTRA_EXEMPT_SELECTORS_DESC="Jeden CSS selektor na riadok, pridá sa k zoznamu vyššie - použite pre vlastný widget, webový komponent alebo prvok tretej strany, ktorý plugin predvolene nerozpozná (napr. my-map-widget alebo .chart-tooltip). Neplatné selektory sa bezpečne ignorujú (skontrolujte konzolu prehliadača pre upozornenie s názvom, ktorý presne). Vlastné elementy sa dajú zhodovať len cez selektor na samotnom elemente, nie na niečom vnútri jeho Shadow DOM."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_LABEL="Zakázať pravý klik"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_DESC="'Nie' ponechá štandardné menu prehliadača. 'Áno' ho zakáže (voliteľne so zobrazením vyskakovacieho okna). 'Len pre obrázky' ho zakáže len nad obrázkami. 'Vlastné menu' nahradí menu prehliadača vaším menu definovaným v záložke 'Vlastné menu' - ak v tejto záložke nezostane žiadna použiteľná položka (žiadna nenastavená, alebo všetky odmietnuté kvôli nepovolenej schéme URL), návštevníci dostanú namiesto žiadneho menu bežné menu prehliadača."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_NO="Nie (štandardné menu prehliadača)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_YES="Áno (voliteľne zobraziť okno)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_IMAGES="Áno, ale len pre obrázky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MODE_MENU="Áno, a zobraziť vlastné menu"

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_VIDEO_LABEL="Chrániť aj video"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_VIDEO_DESC="Použije sa len keď je 'Zakázať pravý klik' nastavené na 'Len pre obrázky'. Rozšíri ochranu (a, ak je zapnuté, aj zákaz ťahania) aj na video prvky. Predvolene vypnuté, keďže ochrana videa je iná záležitosť ako ochrana statických obrázkov."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_BG_LABEL="Chrániť aj CSS background obrázky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_PROTECT_BG_DESC="Použije sa len keď je 'Zakázať pravý klik' nastavené na 'Len pre obrázky'. Rozšíri ochranu na prvky, ktoré majú vlastný CSS background-image (napr. banner alebo karta). Kontroluje sa len presne ten prvok, na ktorý sa kliklo, nie jeho rodičia - takže tlačidlo alebo odkaz vnútri kontajnera s background obrázkom nie je nikdy ovplyvnené. Predvolene vypnuté."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_ENABLED_LABEL="Zobraziť okno pri pravom kliku"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_ENABLED_DESC="Použije sa len keď je 'Zakázať pravý klik' nastavené na 'Áno'."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_TITLE_LABEL="Titulok okna"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_MESSAGE_LABEL="Text okna"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_MESSAGE_DESC="Je povolená obmedzená, bezpečná sada HTML tagov (a, strong, em, b, i, br, p, span, ul, ol, li). Skripty, iframe, event handlery a nebezpečné schémy odkazov sa vždy odstránia."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_TIMEOUT_LABEL="Automaticky zavrieť po (sekundy)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_POPUP_TIMEOUT_DESC="0 = okno zostane otvorené, kým ho návštevník nezavrie."

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MENUITEMS_LABEL="Položky menu"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_MENUITEMS_DESC="Použije sa len keď je 'Zakázať pravý klik' nastavené na 'Vlastné menu'. Každá položka je odkaz alebo jedna z pevne daných vstavaných akcií - vlastný JavaScript spustiť nejde, takže menu nemožno zneužiť na vloženie kódu. Zástupný symbol {url} v odkaze sa nahradí URL aktuálnej stránky. Príklad odkazu: https://twitter.com/intent/tweet?text={url}"

PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_LABEL="Typ"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_LINK="Odkaz (URL)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_ACTION="Vstavaná akcia"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_TYPE_SEPARATOR="Oddeľovač"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ICON_LABEL="Ikona"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ICON_DESC="Emoji (napr. 🔄) alebo CSS trieda ikony (fa-*, icon-*, bi-*)."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_LABEL_LABEL="Popis"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_VALUE_LABEL="URL"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_VALUE_DESC="Používa sa len pre typ 'Odkaz'. Povolené: relatívne cesty (/stranka), #kotvy, ?query reťazce, https://, http://, mailto:, tel:. Akákoľvek iná schéma (javascript:, data:, vbscript:, ...) sa odmietne. {url} = URL aktuálnej stránky: ak je hodnota len {url}, použije sa surová URL (napr. pre odkaz 'táto stránka'); vnútri niečoho iného (napr. ?text={url}) sa automaticky URL-enkóduje, ako je potrebné v query stringu."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_LABEL="Akcia"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_DESC="Používa sa len pre typ 'Vstavaná akcia'. Vyberte jednu z preddefinovaných, bezpečných akcií nižšie - vlastný kód sa zadať nedá. Poznámka k 'Vytlačiť stránku': ak je vyššie zapnuté aj 'Zakázať tlač', táto položka menu stále otvorí dialóg tlače prehliadača, no vytlačená stránka zobrazí len hlásenie 'tlač je zakázaná' - táto ochrana platí bez ohľadu na to, ako bola tlač vyvolaná. Ak chcete, aby tlačidlo naozaj vytlačilo stránku, obe funkcie nekombinujte."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_RELOAD="Obnoviť stránku"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_COPY_URL="Skopírovať URL stránky do schránky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_PRINT="Vytlačiť stránku"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_SCROLL_TOP="Posunúť na začiatok"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_ACTION_SHARE="Zdieľať stránku (alebo skopírovať URL ako náhradu)"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_FIELD_ITEM_NEWTAB_LABEL="Otvoriť v novej karte"

