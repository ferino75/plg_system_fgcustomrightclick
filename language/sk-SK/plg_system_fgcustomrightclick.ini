PLG_SYSTEM_FGCUSTOMRIGHTCLICK_MENU_ARIA_LABEL="Kontextové menu"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_PRINT_DISABLED_MESSAGE="Tlač je na tejto stránke zakázaná."
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_COPIED_MESSAGE="Skopírované do schránky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_COPY_FAILED_MESSAGE="Nepodarilo sa skopírovať do schránky"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_MANUAL_COPY_MESSAGE="Nepodarilo sa skopírovať automaticky. Stlačte Ctrl+C (alebo Cmd+C na Macu) pre skopírovanie:"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_NOSCRIPT_DEFAULT_MESSAGE="Niektoré funkcie ochrany obsahu na tejto stránke vyžadujú zapnutý JavaScript."
