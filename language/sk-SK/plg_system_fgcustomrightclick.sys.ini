PLG_SYSTEM_FGCUSTOMRIGHTCLICK="FG - Custom Right Click"
PLG_SYSTEM_FGCUSTOMRIGHTCLICK_XML_DESCRIPTION="Zakáže tlač, označovanie/kopírovanie textu, ťahanie obrázkov, klávesové skratky vývojárskych nástrojov a kontextové menu prehliadača na fronte webu. Voliteľne zobrazí vyskakovacie okno alebo vlastné, plne prístupné (ARIA) kontextové menu. Pravidlá sa aplikujú len na vybrané skupiny používateľov."
